<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ein kleines Wordle für dich ♡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">

        <div class="decoration">♡</div>

        <h1>WORDLE</h1>
        <p class="subtitle">Ein kleines Rätsel für dich</p>

        <div class="divider">✧</div>

        <p class="instructions">
            Finde das geheime Wort in sechs Versuchen!
        </p>

        <div id="board" class="board"></div>

        <div id="message" class="message"></div>

        <div id="keyboard" class="keyboard"></div>

        <button id="restart" class="restart" hidden>
            Noch einmal spielen
        </button>

        <footer>Made with ♡ just for you</footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
